ReleaseNotes: WinTTS 2.0 con instalador propio de Windows (Inno Setup) en español, instalación por usuario sin elevación, interfaz de entrada única y diseño moderno claro/oscuro automático.
ReleaseNotesUrl: https://github.com/biglexj/WinTTS/blob/main/RELEASE_NOTES.md
InstallationNotes: |
  ✨ Instalación por usuario: no requiere permisos de administrador.
  📂 Se instala en %LOCALAPPDATA%\Programs\WinTTS
  🔗 Repositorio: https://github.com/biglexj/WinTTS
  👤 Desarrollador: biglexj

  💡 Requisito previo: Microsoft Edge WebView2 Runtime (preinstalado en Windows 11
  y en Windows 10 actualizado). El instalador no incluye el bootstrapper.
